[tool.poetry]
name = "classification-agent"
version = "0.1.0"
description = "A hierarchical table field classification agent with thinking-verification architecture built with LangGraph"
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
langgraph = "^0.2.0"
langchain-core = "^0.3.0"
openai = "^1.0.0"
pydantic = "^2.0"
typing-extensions = "^4.8.0"
jinja2 = "^3.1.0"
python-dotenv = "^1.0.0"
numpy = "^1.26.0"
scikit-learn = "^1.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.0.0"
ruff = "^0.5.0"
mypy = "^1.10.0"

# Optional dependencies for BGE local embeddings
[tool.poetry.group.bge.dependencies]
transformers = "^4.40.0"
torch = "^2.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.builders.api"
